services:
  simlingo-scheduler-agent:
    build:
      context: ../..
      dockerfile: simlingo_agents/scheduler_agent/Dockerfile
      additional_contexts:
        simlingo_models: ${SIMLINGO_MODELS_CONTEXT:-/data/gaoshuo/models}
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nvidia/cuda:12.8.0-cudnn-runtime-ubuntu22.04}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://download.pytorch.org/whl/cu128}
    image: simlingo-scheduler-agent:0.2.5
    container_name: simlingo-scheduler-agent
    ports:
      - "9013:9013"
    environment:
      SCHEDULER_MODEL_VARIANT: ${SCHEDULER_MODEL_VARIANT:-/app/models/InternVL2-1B}
      SCHEDULER_CHECKPOINT_PATH: ${SCHEDULER_CHECKPOINT_PATH:-/app/checkpoints/simlingo_scheduler/pytorch_model.bin}
      SCHEDULER_MODE: ${SCHEDULER_MODE:-rule_based}
      SCHEDULER_FIXED_BUDGET: ${SCHEDULER_FIXED_BUDGET:-0.8}
      SCHEDULER_HISTORY_ALPHA: ${SCHEDULER_HISTORY_ALPHA:-0.6}
      SCHEDULER_DECISION_SHIFT_T_LAP: ${SCHEDULER_DECISION_SHIFT_T_LAP:-0.2}
      SCHEDULER_TARGET: ${SCHEDULER_TARGET:-simlingo_adaption_training.models.scheduler.simple_scheduler.SimpleScheduler_L}
      SCHEDULER_TAU: ${SCHEDULER_TAU:-5}
      SCHEDULER_IS_HARD: ${SCHEDULER_IS_HARD:-true}
      SCHEDULER_THRESHOLD: ${SCHEDULER_THRESHOLD:-0.5}
      SCHEDULER_BIAS: ${SCHEDULER_BIAS:-true}
      SCHEDULER_NUM_PREFIX_LAYERS: "10"
      SCHEDULER_RULE_BASED_CFG_JSON: ${SCHEDULER_RULE_BASED_CFG_JSON:-}
      NATS_SERVER_URL: ${NATS_SERVER_URL:-nats://host.docker.internal:4222}
      SCHEDULER_BUDGET_IN_SUBJECT: ${SCHEDULER_BUDGET_IN_SUBJECT:-workflow.simlingo.scheduler_budget_input}
      SCHEDULER_BUDGET_IN_DURABLE: ${SCHEDULER_BUDGET_IN_DURABLE:-workflow-simlingo-scheduler-budget-input}
      SCHEDULER_BUDGET_OUT_SUBJECT: ${SCHEDULER_BUDGET_OUT_SUBJECT:-workflow.simlingo.scheduler_budget_output.llm_prefix_input}
      SCHEDULER_PLAN_IN_SUBJECT: ${SCHEDULER_PLAN_IN_SUBJECT:-workflow.simlingo.llm_prefix_output.scheduler_plan_input}
      SCHEDULER_PLAN_IN_DURABLE: ${SCHEDULER_PLAN_IN_DURABLE:-workflow-simlingo-llm-prefix-output-scheduler-plan-input}
      SCHEDULER_PLAN_OUT_SUBJECT: ${SCHEDULER_PLAN_OUT_SUBJECT:-workflow.simlingo.scheduler_plan_output.llm_final_input}
      SCHEDULER_DECISION_UPDATE_IN_SUBJECT: ${SCHEDULER_DECISION_UPDATE_IN_SUBJECT:-workflow.simlingo.llm_final_output.scheduler_decision_update_input}
      SCHEDULER_DECISION_UPDATE_IN_DURABLE: ${SCHEDULER_DECISION_UPDATE_IN_DURABLE:-workflow-simlingo-llm-final-output-scheduler-decision-update-input}
      SCHEDULER_DECISION_UPDATE_OUT_SUBJECT: ${SCHEDULER_DECISION_UPDATE_OUT_SUBJECT:-workflow.simlingo.scheduler_decision_update_output}
      NATS_STREAM: ${NATS_STREAM:-WORKFLOW}
      NATS_STREAM_SUBJECTS: ${NATS_STREAM_SUBJECTS:-workflow.>}
      NATS_JETSTREAM_DOMAIN: ${NATS_JETSTREAM_DOMAIN:-}
      SIMLINGO_NATS_CODEC: ${SIMLINGO_NATS_CODEC:-msgpack-v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    gpus: all
