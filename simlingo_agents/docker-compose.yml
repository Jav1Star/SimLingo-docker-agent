services:
  simlingo-encoder-agent:
    build:
      context: ..
      dockerfile: simlingo_agents/encoder_agent/Dockerfile
      additional_contexts:
        simlingo_models: ${SIMLINGO_MODELS_CONTEXT:-/home/yyj/simlingo-adaption/models}
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nvidia/cuda:12.8.0-cudnn-runtime-ubuntu22.04}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://download.pytorch.org/whl/cu128}
    image: simlingo-encoder-agent:0.1.1
    container_name: simlingo-encoder-agent
    ports:
      - "9011:9011"
    environment:
      ENCODER_MODEL_VARIANT: ${ENCODER_MODEL_VARIANT:-/app/models/InternVL2-1B}
      ENCODER_CHECKPOINT_PATH: ${ENCODER_CHECKPOINT_PATH:-/app/checkpoints/simlingo_encoder/pytorch_model.bin}
      NATS_SERVER_URL: ${NATS_SERVER_URL:-nats://host.docker.internal:4222}
      NATS_IN_SUBJECT: ${ENCODER_NATS_IN_SUBJECT:-workflow.previousagent.result}
      NATS_IN_DURABLE: ${ENCODER_NATS_IN_DURABLE:-workflow-previousagent-result}
      NATS_OUT_SUBJECT: ${ENCODER_NATS_OUT_SUBJECT:-workflow.simlingo.encoded_tokens}
      NATS_STREAM: ${NATS_STREAM:-WORKFLOW}
      NATS_STREAM_SUBJECTS: ${NATS_STREAM_SUBJECTS:-workflow.>}
      NATS_JETSTREAM_DOMAIN: ${NATS_JETSTREAM_DOMAIN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    gpus: all

  simlingo-llm-agent:
    build:
      context: ..
      dockerfile: simlingo_agents/llm_agent/Dockerfile
      additional_contexts:
        simlingo_models: ${SIMLINGO_MODELS_CONTEXT:-/home/yyj/simlingo-adaption/models}
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nvidia/cuda:12.8.0-cudnn-runtime-ubuntu22.04}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://download.pytorch.org/whl/cu128}
    image: simlingo-llm-agent:0.1.1
    container_name: simlingo-llm-agent
    ports:
      - "9012:9012"
    environment:
      LLM_MODEL_VARIANT: ${LLM_MODEL_VARIANT:-/app/models/InternVL2-1B}
      LLM_CHECKPOINT_PATH: ${LLM_CHECKPOINT_PATH:-/app/checkpoints/simlingo_llm/pytorch_model.bin}
      LLM_SPEED_WPS_MODE: ${LLM_SPEED_WPS_MODE:-2d}
      LLM_PREDICT_ROUTE_AS_WPS: ${LLM_PREDICT_ROUTE_AS_WPS:-true}
      LLM_LORA: ${LLM_LORA:-true}
      LLM_ADAPTION_TRAIN: ${LLM_ADAPTION_TRAIN:-false}
      LLM_LORA_ALPHA: ${LLM_LORA_ALPHA:-64}
      LLM_LORA_R: ${LLM_LORA_R:-32}
      LLM_LORA_DROPOUT: ${LLM_LORA_DROPOUT:-0.1}
      LLM_NUM_PREFIX_LAYERS: ${LLM_NUM_PREFIX_LAYERS:-2}
      LLM_PHASE: ${LLM_PHASE:-prefix}
      LLM_SCHEDULER_TARGET: ${LLM_SCHEDULER_TARGET:-simlingo_adaption_training.models.scheduler.simple_scheduler.SimpleScheduler_L}
      LLM_SCHEDULER_TAU: ${LLM_SCHEDULER_TAU:-5}
      LLM_SCHEDULER_IS_HARD: ${LLM_SCHEDULER_IS_HARD:-true}
      LLM_SCHEDULER_THRESHOLD: ${LLM_SCHEDULER_THRESHOLD:-0.5}
      LLM_SCHEDULER_BIAS: ${LLM_SCHEDULER_BIAS:-true}
      NATS_SERVER_URL: ${NATS_SERVER_URL:-nats://host.docker.internal:4222}
      LLM_PREFIX_IN_SUBJECT: ${LLM_PREFIX_IN_SUBJECT:-workflow.simlingo.llm_prefix_input}
      LLM_PREFIX_IN_DURABLE: ${LLM_PREFIX_IN_DURABLE:-workflow-simlingo-llm-prefix-input}
      LLM_PREFIX_OUT_SUBJECT: ${LLM_PREFIX_OUT_SUBJECT:-workflow.simlingo.llm_prefix_output}
      LLM_FINAL_IN_SUBJECT: ${LLM_FINAL_IN_SUBJECT:-workflow.simlingo.llm_final_input}
      LLM_FINAL_IN_DURABLE: ${LLM_FINAL_IN_DURABLE:-workflow-simlingo-llm-final-input}
      LLM_FINAL_OUT_SUBJECT: ${LLM_FINAL_OUT_SUBJECT:-workflow.simlingo.llm_output}
      NATS_STREAM: ${NATS_STREAM:-WORKFLOW}
      NATS_STREAM_SUBJECTS: ${NATS_STREAM_SUBJECTS:-workflow.>}
      NATS_JETSTREAM_DOMAIN: ${NATS_JETSTREAM_DOMAIN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    gpus: all

  simlingo-scheduler-agent:
    build:
      context: ..
      dockerfile: simlingo_agents/scheduler_agent/Dockerfile
      additional_contexts:
        simlingo_models: ${SIMLINGO_MODELS_CONTEXT:-/home/yyj/simlingo-adaption/models}
      args:
        BASE_IMAGE: ${BASE_IMAGE:-nvidia/cuda:12.8.0-cudnn-runtime-ubuntu22.04}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_EXTRA_INDEX_URL: ${PIP_EXTRA_INDEX_URL:-https://download.pytorch.org/whl/cu128}
    image: simlingo-scheduler-agent:0.1.1
    container_name: simlingo-scheduler-agent
    ports:
      - "9013:9013"
    environment:
      SCHEDULER_MODEL_VARIANT: ${SCHEDULER_MODEL_VARIANT:-/app/models/InternVL2-1B}
      SCHEDULER_CHECKPOINT_PATH: ${SCHEDULER_CHECKPOINT_PATH:-/app/checkpoints/simlingo_scheduler/pytorch_model.bin}
      SCHEDULER_MODE: ${SCHEDULER_MODE:-rule_based}
      SCHEDULER_FIXED_BUDGET: ${SCHEDULER_FIXED_BUDGET:-0.8}
      SCHEDULER_HISTORY_ALPHA: ${SCHEDULER_HISTORY_ALPHA:-0.6}
      SCHEDULER_DECISION_SHIFT_T_LAP: ${SCHEDULER_DECISION_SHIFT_T_LAP:-0.2}
      SCHEDULER_TARGET: ${SCHEDULER_TARGET:-simlingo_adaption_training.models.scheduler.simple_scheduler.SimpleScheduler_L}
      SCHEDULER_TAU: ${SCHEDULER_TAU:-5}
      SCHEDULER_IS_HARD: ${SCHEDULER_IS_HARD:-true}
      SCHEDULER_THRESHOLD: ${SCHEDULER_THRESHOLD:-0.5}
      SCHEDULER_BIAS: ${SCHEDULER_BIAS:-true}
      SCHEDULER_NUM_PREFIX_LAYERS: ${SCHEDULER_NUM_PREFIX_LAYERS:-2}
      SCHEDULER_RULE_BASED_CFG_JSON: ${SCHEDULER_RULE_BASED_CFG_JSON:-}
      SCHEDULER_PHASE: ${SCHEDULER_PHASE:-budget}
      NATS_SERVER_URL: ${NATS_SERVER_URL:-nats://host.docker.internal:4222}
      SCHEDULER_BUDGET_IN_SUBJECT: ${SCHEDULER_BUDGET_IN_SUBJECT:-workflow.simlingo.encoded_tokens}
      SCHEDULER_BUDGET_IN_DURABLE: ${SCHEDULER_BUDGET_IN_DURABLE:-workflow-simlingo-encoded-tokens}
      SCHEDULER_BUDGET_OUT_SUBJECT: ${SCHEDULER_BUDGET_OUT_SUBJECT:-workflow.simlingo.llm_prefix_input}
      SCHEDULER_PLAN_IN_SUBJECT: ${SCHEDULER_PLAN_IN_SUBJECT:-workflow.simlingo.llm_prefix_output}
      SCHEDULER_PLAN_IN_DURABLE: ${SCHEDULER_PLAN_IN_DURABLE:-workflow-simlingo-llm-prefix-output}
      SCHEDULER_PLAN_OUT_SUBJECT: ${SCHEDULER_PLAN_OUT_SUBJECT:-workflow.simlingo.llm_final_input}
      NATS_STREAM: ${NATS_STREAM:-WORKFLOW}
      NATS_STREAM_SUBJECTS: ${NATS_STREAM_SUBJECTS:-workflow.>}
      NATS_JETSTREAM_DOMAIN: ${NATS_JETSTREAM_DOMAIN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    gpus: all
