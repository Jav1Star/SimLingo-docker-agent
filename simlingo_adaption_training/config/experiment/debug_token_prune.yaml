# @package _global_
defaults:
  - /data_module: carla_bucket_v12_dreamer
  - /model/vision_model: vlm
  - /data_module/base_dataset: dataset

model:
  lr: 3e-5
  predict_route_as_wps: True
  speed_wps_mode: 2d
  language_model:
    variant: 'OpenGVLab/InternVL2-1B'
    lora: True
    lora_alpha: 64
    lora_r: 32
    lora_dropout: 0.1
  vision_model:
    variant: 'OpenGVLab/InternVL2-1B'
    token_prune:
      mode: prune2drive
      prune_ratio: 0.5
      min_keep: 1
  scheduler_model:
    tau: 5
    is_hard: True
    threshold: 0.5
    bias: True
    num_prefix_layers: 10
    _target_: "simlingo_adaption_training.models.scheduler.simple_scheduler.SimpleScheduler_L"

data_module:
  batch_size: 1
  num_workers: 1
  base_dataset:
    data_path: data/simlingo
    bucket_path: data/simlingo
    pred_len: 11
    cut_bottom_quarter: True
    use_commentary: True
    use_qa: True
    qa_augmentation: True
    img_shift_augmentation: True
    img_shift_augmentation_prob: 0.5
    hist_len: 1
    route_as: target_point_command
    use_lmdrive_commands: True
    use_old_towns: True
    use_town13: True
    use_safety_flag: True

max_epochs: 15
val_every_n_epochs: 1

debug: True
gpus: 1
seed: 42
adaption_train: True
simlingo_checkpoint: "models/simlingoCheckpoints/checkpoints/epoch=013.ckpt/pytorch_model.pt"
name: debug_token_prune
