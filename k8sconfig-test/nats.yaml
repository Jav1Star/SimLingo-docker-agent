apiVersion: v1
kind: Namespace
metadata:
  name: simlingo-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: simlingo-test
  labels:
    app: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-js"
          ports:
            - containerPort: 4222
              name: client
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: simlingo-test
spec:
  selector:
    app: nats
  ports:
    - name: client
      protocol: TCP
      port: 4222
      targetPort: 4222
      nodePort: 30423
  type: NodePort
