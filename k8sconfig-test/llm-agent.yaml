apiVersion: apps/v1
kind: Deployment
metadata:
  name: simlingo-llm-agent
  namespace: default
  labels:
    app: simlingo-llm-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: simlingo-llm-agent
  template:
    metadata:
      labels:
        app: simlingo-llm-agent
    spec:
      nodeSelector:
        feature.node.kubernetes.io/pci-10de.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: simlingo-llm-agent
          image: simlingo-llm-agent:0.2.7
          imagePullPolicy: IfNotPresent
          terminationMessagePolicy: FallbackToLogsOnError
          ports:
            - containerPort: 9012
              name: http
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          env:
            - name: SIMLINGO_EVAL_RECORD_TFLOPS
              value: "1"
            - name: LLM_MODEL_VARIANT
              value: /app/models/InternVL2-1B
            - name: LLM_CHECKPOINT_PATH
              value: /app/checkpoints/simlingo_llm/pytorch_model.bin
            - name: LLM_SPEED_WPS_MODE
              value: 2d
            - name: LLM_PREDICT_ROUTE_AS_WPS
              value: "true"
            - name: LLM_LORA
              value: "true"
            - name: LLM_ADAPTION_TRAIN
              value: "true"
            - name: LLM_LORA_ALPHA
              value: "64"
            - name: LLM_LORA_R
              value: "32"
            - name: LLM_LORA_DROPOUT
              value: "0.1"
            - name: LLM_NUM_PREFIX_LAYERS
              value: "10"
            - name: LLM_SCHEDULER_NUM_PREFIX_LAYERS
              value: "10"
            - name: LLM_SCHEDULER_TARGET
              value: simlingo_adaption_training.models.scheduler.simple_scheduler.SimpleScheduler_L
            - name: LLM_SCHEDULER_TAU
              value: "5"
            - name: LLM_SCHEDULER_IS_HARD
              value: "true"
            - name: LLM_SCHEDULER_THRESHOLD
              value: "0.5"
            - name: LLM_SCHEDULER_BIAS
              value: "true"
            - name: NATS_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: edge-cluster-config
                  key: NATS_SERVERS
            - name: NATS_SERVER_URL
              value: nats://nats:4222
            - name: CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: edge-cluster-config
                  key: CLUSTER_ID
            - name: NATS_JETSTREAM_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: edge-cluster-config
                  key: NATS_JETSTREAM_DOMAIN
            - name: AGENT_ID
              value: simlingo-llm
            - name: AGENT_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LLM_PREFIX_IN_SUBJECT
              value: workflow.local.$(CLUSTER_ID).agent.$(AGENT_ID).instance.$(AGENT_INSTANCE_ID).llm_prefix_input
            - name: LLM_PREFIX_IN_DURABLE
              value: simlingo-llm-$(AGENT_INSTANCE_ID)-prefix-input
            - name: LLM_PREFIX_OUT_SUBJECT
              value: workflow.local.$(CLUSTER_ID).agent.simlingo-scheduler.instance.__SCHEDULER_INSTANCE_ID__.scheduler_plan_input
            - name: LLM_FINAL_IN_SUBJECT
              value: workflow.local.$(CLUSTER_ID).agent.$(AGENT_ID).instance.$(AGENT_INSTANCE_ID).llm_final_input
            - name: LLM_FINAL_IN_DURABLE
              value: simlingo-llm-$(AGENT_INSTANCE_ID)-final-input
            - name: LLM_FINAL_OUT_SUBJECT
              value: workflow.local.$(CLUSTER_ID).agent.$(AGENT_ID).instance.$(AGENT_INSTANCE_ID).llm_final_output
            - name: LLM_DECISION_UPDATE_OUT_SUBJECT
              value: workflow.local.$(CLUSTER_ID).agent.simlingo-scheduler.instance.__SCHEDULER_INSTANCE_ID__.scheduler_decision_update_input
            - name: NATS_WORKFLOW_STREAM_PREFIX
              value: WF
            - name: NATS_STREAM_MAX_BYTES
              value: 512MiB
            - name: NATS_STREAM_DISCARD
              value: new
            - name: NATS_STREAM_RETENTION
              value: workqueue
            - name: NATS_STREAM_STORAGE
              value: file
            - name: NATS_CONSUMER_INACTIVE_THRESHOLD_SEC
              value: "300"
            - name: SIMLINGO_NATS_CODEC
              value: msgpack-v1
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 180
            periodSeconds: 10
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: simlingo-llm-service
  namespace: default
spec:
  selector:
    app: simlingo-llm-agent
  ports:
    - name: http
      protocol: TCP
      port: 9012
      nodePort: 30112
      targetPort: 9012
  type: NodePort
