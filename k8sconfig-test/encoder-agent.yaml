apiVersion: apps/v1
kind: Deployment
metadata:
  name: simlingo-encoder-agent
  namespace: default
  labels:
    app: simlingo-encoder-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: simlingo-encoder-agent
  template:
    metadata:
      labels:
        app: simlingo-encoder-agent
    spec:
      nodeSelector:
        feature.node.kubernetes.io/pci-10de.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: simlingo-encoder-agent
          image: simlingo-encoder-agent:0.2.7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9011
              name: http
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          env:
            - name: SIMLINGO_EVAL_RECORD_TFLOPS
              value: "1"
            - name: ENCODER_MODEL_VARIANT
              value: /app/models/InternVL2-1B
            - name: ENCODER_CHECKPOINT_PATH
              value: /app/checkpoints/simlingo_encoder/pytorch_model.bin
            - name: NATS_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: edge-cluster-config
                  key: NATS_SERVERS
            - name: NATS_SERVER_URL
              value: nats://nats:4222
            - name: CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: edge-cluster-config
                  key: CLUSTER_ID
            - name: NATS_JETSTREAM_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: edge-cluster-config
                  key: NATS_JETSTREAM_DOMAIN
            - name: AGENT_ID
              value: simlingo-encoder
            - name: AGENT_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NATS_IN_SUBJECT
              value: workflow.local.$(CLUSTER_ID).agent.$(AGENT_ID).instance.$(AGENT_INSTANCE_ID).encoder_input
            - name: NATS_IN_DURABLE
              value: simlingo-encoder-$(AGENT_INSTANCE_ID)-encoder-input
            - name: NATS_OUT_SUBJECT
              value: workflow.local.$(CLUSTER_ID).agent.simlingo-scheduler.instance.__SCHEDULER_INSTANCE_ID__.scheduler_budget_input
            - name: NATS_WORKFLOW_STREAM_PREFIX
              value: WF
            - name: NATS_STREAM_MAX_BYTES
              value: 512MiB
            - name: NATS_STREAM_DISCARD
              value: new
            - name: NATS_STREAM_RETENTION
              value: workqueue
            - name: NATS_STREAM_STORAGE
              value: file
            - name: NATS_CONSUMER_INACTIVE_THRESHOLD_SEC
              value: "300"
            - name: SIMLINGO_NATS_CODEC
              value: msgpack-v1
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: simlingo-encoder-service
  namespace: default
spec:
  selector:
    app: simlingo-encoder-agent
  ports:
    - name: http
      protocol: TCP
      port: 9011
      nodePort: 30111
      targetPort: 9011
  type: NodePort
