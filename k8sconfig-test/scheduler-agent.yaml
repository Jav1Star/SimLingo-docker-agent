apiVersion: apps/v1
kind: Deployment
metadata:
  name: simlingo-scheduler-agent
  namespace: default
  labels:
    app: simlingo-scheduler-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: simlingo-scheduler-agent
  template:
    metadata:
      labels:
        app: simlingo-scheduler-agent
    spec:
      nodeSelector:
        feature.node.kubernetes.io/pci-10de.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: simlingo-scheduler-agent
          image: simlingo-scheduler-agent:0.1.4
          imagePullPolicy: IfNotPresent
          terminationMessagePolicy: FallbackToLogsOnError
          ports:
            - containerPort: 9013
              name: http
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          env:
            - name: SCHEDULER_MODEL_VARIANT
              value: /app/models/InternVL2-1B
            - name: SCHEDULER_CHECKPOINT_PATH
              value: /app/checkpoints/simlingo_scheduler/pytorch_model.bin
            - name: SCHEDULER_MODE
              value: rule_based
            - name: SCHEDULER_FIXED_BUDGET
              value: "0.8"
            - name: SCHEDULER_HISTORY_ALPHA
              value: "0.6"
            - name: SCHEDULER_DECISION_SHIFT_T_LAP
              value: "0.2"
            - name: SCHEDULER_TARGET
              value: simlingo_adaption_training.models.scheduler.simple_scheduler.SimpleScheduler_L
            - name: SCHEDULER_TAU
              value: "5"
            - name: SCHEDULER_IS_HARD
              value: "true"
            - name: SCHEDULER_THRESHOLD
              value: "0.5"
            - name: SCHEDULER_BIAS
              value: "true"
            - name: SCHEDULER_NUM_PREFIX_LAYERS
              value: "10"
            - name: SCHEDULER_RULE_BASED_CFG_JSON
              value: ""
            - name: NATS_SERVER_URL
              value: nats://nats:4222
            - name: SCHEDULER_BUDGET_IN_SUBJECT
              value: workflow.simlingo.scheduler_budget_input
            - name: SCHEDULER_BUDGET_IN_DURABLE
              value: workflow-simlingo-scheduler-budget-input
            - name: SCHEDULER_BUDGET_OUT_SUBJECT
              value: workflow.simlingo.scheduler_budget_output.llm_prefix_input
            - name: SCHEDULER_PLAN_IN_SUBJECT
              value: workflow.simlingo.llm_prefix_output.scheduler_plan_input
            - name: SCHEDULER_PLAN_IN_DURABLE
              value: workflow-simlingo-llm-prefix-output-scheduler-plan-input
            - name: SCHEDULER_PLAN_OUT_SUBJECT
              value: workflow.simlingo.scheduler_plan_output.llm_final_input
            - name: NATS_STREAM
              value: WORKFLOW
            - name: NATS_STREAM_SUBJECTS
              value: workflow.>
            - name: NATS_JETSTREAM_DOMAIN
              value: "hub"
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 120
            periodSeconds: 10
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: simlingo-scheduler-service
  namespace: default
spec:
  selector:
    app: simlingo-scheduler-agent
  ports:
    - name: http
      protocol: TCP
      port: 9013
      nodePort: 30113
      targetPort: 9013
  type: NodePort
