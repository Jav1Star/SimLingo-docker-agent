apiVersion: apps/v1
kind: Deployment
metadata:
  name: simlingo-scheduler-agent
  namespace: default
  labels:
    app: simlingo-scheduler-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: simlingo-scheduler-agent
  template:
    metadata:
      labels:
        app: simlingo-scheduler-agent
    spec:
      nodeSelector:
        feature.node.kubernetes.io/pci-10de.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: simlingo-scheduler-agent
          image: simlingo-scheduler-agent:0.2.7
          imagePullPolicy: IfNotPresent
          terminationMessagePolicy: FallbackToLogsOnError
          ports:
            - containerPort: 9013
              name: http
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          env:
            - name: SIMLINGO_EVAL_RECORD_TFLOPS
              value: "1"
            - name: SCHEDULER_MODEL_VARIANT
              value: /app/models/InternVL2-1B
            - name: SCHEDULER_CHECKPOINT_PATH
              value: /app/checkpoints/simlingo_scheduler/pytorch_model.bin
            - name: SCHEDULER_MODE
              value: rule_based
            - name: SCHEDULER_FIXED_BUDGET
              value: "0.8"
            - name: SCHEDULER_HISTORY_ALPHA
              value: "0.6"
            - name: SCHEDULER_DECISION_SHIFT_T_LAP
              value: "0.2"
            - name: SCHEDULER_TARGET
              value: simlingo_adaption_training.models.scheduler.simple_scheduler.SimpleScheduler_L
            - name: SCHEDULER_TAU
              value: "5"
            - name: SCHEDULER_IS_HARD
              value: "true"
            - name: SCHEDULER_THRESHOLD
              value: "0.5"
            - name: SCHEDULER_BIAS
              value: "true"
            - name: SCHEDULER_NUM_PREFIX_LAYERS
              value: "10"
            - name: SCHEDULER_RULE_BASED_CFG_JSON
              value: ""
            - name: NATS_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: edge-cluster-config
                  key: NATS_SERVERS
            - name: NATS_SERVER_URL
              value: nats://nats:4222
            - name: CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: edge-cluster-config
                  key: CLUSTER_ID
            - name: NATS_JETSTREAM_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: edge-cluster-config
                  key: NATS_JETSTREAM_DOMAIN
            - name: AGENT_ID
              value: simlingo-scheduler
            - name: AGENT_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SCHEDULER_BUDGET_IN_SUBJECT
              value: workflow.local.$(CLUSTER_ID).agent.$(AGENT_ID).instance.$(AGENT_INSTANCE_ID).scheduler_budget_input
            - name: SCHEDULER_BUDGET_IN_DURABLE
              value: simlingo-scheduler-$(AGENT_INSTANCE_ID)-budget-input
            - name: SCHEDULER_BUDGET_OUT_SUBJECT
              value: workflow.local.$(CLUSTER_ID).agent.simlingo-llm.instance.__LLM_INSTANCE_ID__.llm_prefix_input
            - name: SCHEDULER_PLAN_IN_SUBJECT
              value: workflow.local.$(CLUSTER_ID).agent.$(AGENT_ID).instance.$(AGENT_INSTANCE_ID).scheduler_plan_input
            - name: SCHEDULER_PLAN_IN_DURABLE
              value: simlingo-scheduler-$(AGENT_INSTANCE_ID)-plan-input
            - name: SCHEDULER_PLAN_OUT_SUBJECT
              value: workflow.local.$(CLUSTER_ID).agent.simlingo-llm.instance.__LLM_INSTANCE_ID__.llm_final_input
            - name: SCHEDULER_DECISION_UPDATE_IN_SUBJECT
              value: workflow.local.$(CLUSTER_ID).agent.$(AGENT_ID).instance.$(AGENT_INSTANCE_ID).scheduler_decision_update_input
            - name: SCHEDULER_DECISION_UPDATE_IN_DURABLE
              value: simlingo-scheduler-$(AGENT_INSTANCE_ID)-decision-update-input
            - name: SCHEDULER_DECISION_UPDATE_OUT_SUBJECT
              value: workflow.local.$(CLUSTER_ID).agent.$(AGENT_ID).instance.$(AGENT_INSTANCE_ID).scheduler_decision_update_output
            - name: NATS_WORKFLOW_STREAM_PREFIX
              value: WF
            - name: NATS_STREAM_MAX_BYTES
              value: 512MiB
            - name: NATS_STREAM_DISCARD
              value: new
            - name: NATS_STREAM_RETENTION
              value: workqueue
            - name: NATS_STREAM_STORAGE
              value: file
            - name: NATS_CONSUMER_INACTIVE_THRESHOLD_SEC
              value: "300"
            - name: SIMLINGO_NATS_CODEC
              value: msgpack-v1
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 120
            periodSeconds: 10
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: simlingo-scheduler-service
  namespace: default
spec:
  selector:
    app: simlingo-scheduler-agent
  ports:
    - name: http
      protocol: TCP
      port: 9013
      nodePort: 30113
      targetPort: 9013
  type: NodePort
