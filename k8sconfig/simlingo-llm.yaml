apiVersion: apps/v1
kind: Deployment
metadata:
  name: simlingo-llm-agent
  labels:
    app: simlingo-llm-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: simlingo-llm-agent
  template:
    metadata:
      labels:
        app: simlingo-llm-agent
    spec:
      nodeSelector:
        feature.node.kubernetes.io/pci-10de.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: simlingo-llm-agent
          image: REGISTRY_HOST/PROJECT/simlingo-llm-agent:0.1.2-mcp
          imagePullPolicy: Always
          ports:
            - containerPort: 9012
              name: http
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          env:
            - name: NATS_SERVER_URL
              value: nats://nats:4222
            # Phase 1: Prefix 阶段输入与输出
            - name: LLM_PREFIX_IN_SUBJECT
              value: workflow.simlingo.llm_prefix_input
            - name: LLM_PREFIX_IN_DURABLE
              value: workflow-simlingo-llm-prefix-input
            - name: LLM_PREFIX_OUT_SUBJECT
              value: workflow.simlingo.llm_prefix_output
            # Phase 2: Final 阶段输入与输出
            - name: LLM_FINAL_IN_SUBJECT
              value: workflow.simlingo.llm_final_input
            - name: LLM_FINAL_IN_DURABLE
              value: workflow-simlingo-llm-final-input
            - name: LLM_FINAL_OUT_SUBJECT
              value: workflow.simlingo.llm_output
            - name: NATS_STREAM
              value: WORKFLOW
            - name: NATS_STREAM_SUBJECTS
              value: workflow.>
            - name: NATS_JETSTREAM_DOMAIN
              value: ""
            - name: SIMLINGO_NATS_CODEC
              value: msgpack-v1
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 180
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: simlingo-llm-service
spec:
  selector:
    app: simlingo-llm-agent
  ports:
    - name: http
      protocol: TCP
      port: 9012
      nodePort: 30012
      targetPort: 9012
  type: NodePort
