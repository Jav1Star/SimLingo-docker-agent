apiVersion: apps/v1
kind: Deployment
metadata:
  name: simlingo-encoder-agent
  labels:
    app: simlingo-encoder-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simlingo-encoder-agent
  template:
    metadata:
      labels:
        app: simlingo-encoder-agent 
    spec:
      nodeSelector:
        feature.node.kubernetes.io/pci-10de.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: simlingo-encoder-agent
          image: simlingo-encoder-agent:0.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9011
              name: http
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          env:
            - name: NATS_SERVER_URL
              value: nats://nats:4222
            # 接收前置节点的输入
            - name: NATS_IN_SUBJECT
              value: workflow.previousagent.result
            - name: NATS_IN_DURABLE
              value: workflow-previousagent-result
            # 输出编码特征
            - name: NATS_SUBJECT
              value: workflow.simlingo.encoded_tokens
---
apiVersion: v1
kind: Service
metadata:
  name: simlingo-encoder-service
spec:
  selector:
    app: simlingo-encoder-agent
  ports:
    - name: http
      protocol: TCP
      port: 9011
      nodePort: 30011
      targetPort: 9011
  type: NodePort
