apiVersion: apps/v1
kind: Deployment
metadata:
  name: simlingo-encoder-agent
  labels:
    app: simlingo-encoder-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: simlingo-encoder-agent
  template:
    metadata:
      labels:
        app: simlingo-encoder-agent 
    spec:
      nodeSelector:
        feature.node.kubernetes.io/pci-10de.present: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: simlingo-encoder-agent
          image: REGISTRY_HOST/PROJECT/simlingo-encoder-agent:0.1.2-mcp
          imagePullPolicy: Always
          ports:
            - containerPort: 9011
              name: http
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          env:
            - name: NATS_SERVER_URL
              value: nats://nats:4222
            # 接收前置节点的输入
            - name: NATS_IN_SUBJECT
              value: workflow.previousagent.result
            - name: NATS_IN_DURABLE
              value: workflow-previousagent-result
            # 输出编码特征
            - name: NATS_OUT_SUBJECT
              value: workflow.simlingo.encoded_tokens
            - name: ENCODER_TOKEN_PRUNE_MODE
              value: origin
            - name: ENCODER_TOKEN_PRUNE_RATIO
              value: "0.0"
            - name: ENCODER_TOKEN_PRUNE_MIN_KEEP
              value: "1"
            - name: NATS_STREAM
              value: WORKFLOW
            - name: NATS_STREAM_SUBJECTS
              value: workflow.>
            - name: NATS_JETSTREAM_DOMAIN
              value: ""
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 120
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: simlingo-encoder-service
spec:
  selector:
    app: simlingo-encoder-agent
  ports:
    - name: http
      protocol: TCP
      port: 9011
      nodePort: 30011
      targetPort: 9011
  type: NodePort
