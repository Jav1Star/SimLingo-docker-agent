apiVersion: apps/v1
kind: Deployment
metadata:
  name: simlingo-scheduler-agent
  labels:
    app: simlingo-scheduler-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simlingo-scheduler-agent
  template:
    metadata:
      labels:
        app: simlingo-scheduler-agent
    spec:
      containers:
        - name: simlingo-scheduler-agent
          image: simlingo-scheduler-agent:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9013
              name: http
          env:
            - name: NATS_SERVER_URL
              value: nats://nats:4222
            # Phase 1: Budget 阶段输入与输出
            - name: SCHEDULER_BUDGET_IN_SUBJECT
              value: workflow.simlingo.encoded_tokens
            - name: SCHEDULER_BUDGET_IN_DURABLE
              value: workflow-simlingo-encoded-tokens
            - name: SCHEDULER_BUDGET_OUT_SUBJECT
              value: workflow.simlingo.llm_prefix_input
            # Phase 2: Plan 阶段输入与输出
            - name: SCHEDULER_PLAN_IN_SUBJECT
              value: workflow.simlingo.llm_prefix_output
            - name: SCHEDULER_PLAN_IN_DURABLE
              value: workflow-simlingo-llm-prefix-output
            - name: SCHEDULER_PLAN_OUT_SUBJECT
              value: workflow.simlingo.llm_final_input
---
apiVersion: v1
kind: Service
metadata:
  name: simlingo-scheduler-service
spec:
  selector:
    app: simlingo-scheduler-agent
  ports:
    - name: http
      protocol: TCP
      port: 9013
      nodePort: 30013
      targetPort: 9013
  type: NodePort