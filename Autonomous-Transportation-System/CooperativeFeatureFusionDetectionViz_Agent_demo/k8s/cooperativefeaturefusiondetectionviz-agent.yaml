apiVersion: apps/v1
kind: Deployment
metadata:
  name: cooperativefeaturefusiondetectionviz-agent
  labels:
    app: cooperativefeaturefusiondetectionviz-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cooperativefeaturefusiondetectionviz-agent
  template:
    metadata:
      labels:
        app: cooperativefeaturefusiondetectionviz-agent
    spec:
      containers:
        - name: cooperativefeaturefusiondetectionviz-agent
          image: cooperativefeaturefusiondetectionviz-agent:0.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9002
              name: http
          env:
            - name: MODEL_CHECKPOINT_PATH
              value: /app/checkpoints/point_pillar_where2comm/
            - name: QT_GRAPHICSSYSTEM
              value: native
            - name: NATS_SERVER_URL
              value: nats://nats:4222
            - name: NATS_SUBJECT
              value: workflow.demo.perception2feature.result
            - name: NATS_DURABLE
              value: workflow-demo-perception2feature-result
          resources:
            limits:
              nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: cooperativefeaturefusiondetectionviz-agent
  labels:
    app: cooperativefeaturefusiondetectionviz-agent
spec:
  selector:
    app: cooperativefeaturefusiondetectionviz-agent
  ports:
    - name: http
      protocol: TCP
      port: 9002
      targetPort: 9002
  type: NodePort
